[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smallgameagent"
version = "0.1.0"
description = "LLM-driven game-playing agent + VLM fine-tuning pipeline for Cocos Creator HTML5 playable ads"
requires-python = ">=3.14"
dependencies = [
    "openai>=1.0",
    "playwright>=1.50",
    "pillow>=10.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
inference = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
]
training = [
    "torch>=2.5",
    "transformers>=4.50",
    "datasets>=3.0",
    "peft>=0.15",
    "trl>=0.15",
    "accelerate>=1.0",
    "bitsandbytes>=0.45",
    "wandb>=0.19",
]
memory = [
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.10",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
